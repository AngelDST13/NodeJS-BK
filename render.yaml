# Blueprint de Render (infraestructura como código).
# Los secretos se marcan sync: false: Render los pide en el panel y NUNCA viven en el repositorio.
services:
  - type: web
    name: securevault
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Solo despliega cuando el pipeline de GitHub Actions pasó (pruebas, npm audit, gitleaks).
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      # Render tiene dos saltos de proxy delante de la app (Cloudflare + balanceador de Render).
      # Con 1, req.ip sería la IP de Cloudflare (cambia por petición) y el límite por IP no funcionaría.
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_SSL
        value: "true"
      - key: DATA_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
