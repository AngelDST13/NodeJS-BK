# Solo para desarrollo local: PostgreSQL ligado a localhost (no expuesto a la red).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: securevault
      POSTGRES_DB: securevault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevault"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
